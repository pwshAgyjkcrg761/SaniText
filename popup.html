<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    :root {
      --bg-color: #f1f3f4; 
      --text-color: #202124;
      --hover-color: rgba(0, 0, 0, 0.05);
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg-color: #202124;
        --text-color: #e8eaed;
        --hover-color: rgba(255, 255, 255, 0.1);
      }
    }
    body { 
      width: 280px; 
      padding: 12px; 
      font-family: "Segoe UI", Tahoma, sans-serif;
      font-size: 13px; 
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
    }
    .row { 
      margin-bottom: 8px; 
      display: flex; 
      align-items: center; 
      cursor: pointer;
      padding: 6px;
      border-radius: 4px;
    }
    .row:hover { background-color: var(--hover-color); }
    input[type="checkbox"] { margin-right: 12px; cursor: pointer; }
    label { cursor: pointer; user-select: none; flex-grow: 1; font-weight: 500; }
    .desc { font-size: 11px; opacity: 0.7; display: block; margin-top: 2px; font-weight: normal; }
  </style>
</head>
<body>
  <div class="row">
    <input type="checkbox" id="lowerCaseToggle">
    <label for="lowerCaseToggle">Lowercase Mode<span class="desc">Converts all copied text to lowercase.</span></label>
  </div>
  <div class="row">
    <input type="checkbox" id="slashToggle">
    <label for="slashToggle">Convert / to ∕ Division Slash<span class="desc">Replaces / with a character legal in filenames.</span></label>
  </div>
  <div class="row">
    <input type="checkbox" id="legalQToggle">
    <label for="legalQToggle">Use Legal Full-width ？；<span class="desc">Replaces ? and ; with wide versions for scripts.</span></label>
  </div>
  <div class="row">
    <input type="checkbox" id="partToggle">
    <label for="partToggle">Remove "Part" from Numbers<span class="desc">Strips "Part" from "Part 1", "Part 2", etc.</span></label>
  </div>
  <div class="row">
    <input type="checkbox" id="sanitizeToggle">
    <label for="sanitizeToggle">Remove Illegal Characters<span class="desc">Strips \ / : * ? " < > | and legal ; from copied text.</span></label>
  </div>
  <script src="popup.js"></script>
</body>
</html>
